name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.193.71
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/wingo-oracle
            git checkout -- scraper.js
            git pull origin master
            pm2 restart wingo-oracle
            echo "Deploy OK: $(date)"
